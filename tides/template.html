<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIDES — Europe 1792–1815</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap">
<style>
:root{--bg:#0b0d12;--land:#1a1f2b;--line:#2c3446;--fr:#3b6fd6;--fr2:#7aa0ec;--co:#d64a3b;--co2:#f08a7a;--neu:#2a3140;--ink:#e8e4da;--mute:#8a90a0;--gold:#e0b45a;--panel:rgba(14,17,24,.86)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;overflow:hidden}
#map{position:absolute;inset:0;cursor:grab}
#map:active{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.state{stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .8s ease}
.state.fr{fill:var(--fr)}.state.co{fill:var(--co)}.state.neu{fill:var(--neu)}
.state:hover{stroke:var(--ink)}
.ev{fill:var(--gold);stroke:none;pointer-events:all;cursor:pointer}
.ev.past{fill:var(--mute);opacity:.55}
.ring{fill:none;stroke:var(--gold);stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.arrow{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none;stroke-dasharray:6 5;animation:march 1.2s linear infinite}
.arrow.FR{stroke:var(--fr2)}.arrow.FR_RET{stroke:#9aa7c4;stroke-dasharray:2 6}.arrow.CO,.arrow.GB{stroke:var(--co2)}
@keyframes march{to{stroke-dashoffset:-22}}
.lbl{font-size:10px;fill:var(--mute);pointer-events:none;text-anchor:middle;letter-spacing:.04em;text-transform:uppercase}
#hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));max-width:min(360px,calc(100vw - 28px));pointer-events:none}
#year{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(44px,8vw,84px);line-height:.9;letter-spacing:-.02em}
#date{font-size:12px;color:var(--mute);margin-top:6px}
#era{font-family:Fraunces,Georgia,serif;font-size:clamp(16px,2.6vw,22px);font-weight:600;margin-top:8px;color:var(--gold)}
#brand{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));text-align:right;font-size:11px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
#brand b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;letter-spacing:.3em;color:var(--ink);font-weight:300}
#ticker{position:fixed;right:14px;top:calc(72px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 28px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);padding:8px 10px;font-size:11.5px;line-height:1.4;backdrop-filter:blur(6px);animation:in .5s ease both}
.card b{display:block;font-family:Fraunces,Georgia,serif;font-size:15px;font-weight:600;letter-spacing:0}
.card i{color:var(--mute);font-style:normal}
@keyframes in{from{opacity:0;transform:translateX(12px)}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;cursor:pointer;border-radius:3px}
button:hover{border-color:var(--gold)}button.on{border-color:var(--gold);color:var(--gold)}
#play{min-width:74px}
.seg{display:flex;gap:4px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--gold);margin:10px 0 2px}
#legend{display:flex;gap:14px;font-size:10px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
#legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
#legend .f::before{background:var(--fr)}#legend .c::before{background:var(--co)}#legend .n::before{background:var(--neu)}#legend .b::before{background:var(--gold);border-radius:50%}
#tip{position:fixed;display:none;background:var(--panel);border:1px solid var(--gold);padding:8px 10px;font-size:11.5px;max-width:260px;pointer-events:none;z-index:9;line-height:1.4}
#tip b{font-family:Fraunces,Georgia,serif;font-size:15px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:640px){#ticker{top:auto;bottom:118px;width:calc(100vw - 28px);right:14px}#brand b{font-size:16px}}
</style></head><body>
<div id="map"><svg><g id="view"><g id="states"></g><g id="arrows"></g><g id="rings"></g><g id="evts"></g><g id="labels"></g></g></svg></div>
<div id="loading">Loading map…</div>
<div id="hud"><div id="year">1792</div><div id="date"></div><div id="era"></div></div>
<div id="brand"><b>TIDES</b>Europe · 1792–1815 · real history, no units</div>
<div id="ticker"></div>
<div id="tip"></div>
<div id="bar">
 <div id="ctl">
  <button id="play">▶ Play</button>
  <button id="spd" title="speed">1×</button>
  <button id="rst">↺</button>
  <div class="seg"><button data-v="eu" class="on">Europe</button><button data-v="ib">Iberia</button><button data-v="ce">Central</button><button data-v="ru">Russia</button></div>
 </div>
 <input id="t" type="range" min="0" max="1" step="1" value="0">
 <div id="legend"><span class="f">French bloc</span><span class="c">Coalition</span><span class="n">Neutral</span><span class="b">Battle</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const __GZ="__GZ__";
async function __boot(){
 const bin=Uint8Array.from(atob(__GZ),c=>c.charCodeAt(0));
 const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 const D_=JSON.parse(txt);
 document.getElementById("loading").remove();
 __main(D_.B,D_.E,D_.A);
}
function __main(BORDERS,EV,AR){
const DAY=86400000, T0=Date.UTC(1792,3,20), T1=Date.UTC(1815,10,20), NDAYS=Math.round((T1-T0)/DAY);
const d=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const ALLEG=[
 [/^UK|United Kingdom of Great|Kingdom of Ireland/,'co','1793-02-01','1815-12-31'],
 [/^France$/,'fr','1792-04-20','1815-12-31'],
 [/Austria/,'co','1792-04-20','1797-10-17'],[/Austria/,'co','1799-03-12','1801-02-09'],[/Austria/,'co','1805-08-09','1805-12-26'],[/Austria/,'co','1809-04-10','1809-10-14'],[/Austria/,'co','1813-08-12','1815-12-31'],
 [/^Prussia$/,'co','1792-04-20','1795-04-05'],[/^Prussia$/,'co','1806-10-09','1807-07-09'],[/^Prussia$/,'co','1813-03-17','1815-12-31'],
 [/Russian Empire/,'co','1798-12-29','1800-10-01'],[/Russian Empire/,'co','1805-04-11','1807-07-07'],[/Russian Empire/,'co','1812-06-24','1815-12-31'],
 [/^Sweden/,'co','1805-10-31','1810-01-06'],[/^Sweden/,'co','1813-03-03','1814-05-30'],
 [/^Spain$/,'co','1793-03-07','1795-07-22'],[/^Spain$/,'fr','1796-08-19','1808-05-02'],[/^Spain$/,'co','1808-05-02','1815-12-31'],
 [/^Portugal$/,'co','1793-07-15','1815-12-31'],
 [/Netherlands|Batavian/,'co','1793-02-01','1795-01-19'],[/Netherlands|Batavian/,'fr','1795-01-19','1813-11-30'],[/Netherlands/,'co','1813-11-30','1815-12-31'],
 [/Helvetic|Swiss|Switzerland/,'fr','1798-04-12','1813-12-29'],
 [/Lombardy|Venetia|Parma|Modena|Tuscany|Lucca|Massa|Fivizzano|Pontremoli/,'fr','1797-06-29','1814-04-11'],
 [/Papal/,'fr','1808-02-02','1814-05-24'],
 [/Two Sicilies/,'co','1793-07-12','1796-10-10'],[/Two Sicilies/,'fr','1806-02-14','1815-05-20'],
 [/Sardinia/,'co','1792-09-20','1796-05-15'],
 [/Bavaria|Württemberg|Baden|Saxony|Hohenzollern|Anhalt|Thuringia|Waldeck|Lippe|Nassau|Hesse|Mecklenburg|Oldenburg|Brunswick|Hanover|Swabia|Palatinate|Wetzlar/,'fr','1806-07-12','1813-10-19'],
 [/Bavaria|Württemberg|Baden|Saxony|Hanover|Brunswick|Hesse|Mecklenburg|Oldenburg|Nassau/,'co','1813-10-19','1815-12-31'],
 [/Hanover|Brunswick/,'co','1792-04-20','1803-06-05'],
 [/Denmark/,'fr','1807-10-31','1814-01-14'],
 [/Hamburg|Bremen|Lübeck|Cuxhaven|Holstein|Luxembourg/,'fr','1810-12-13','1813-10-19'],
 [/Ottoman/,'co','1798-09-09','1802-06-25'],[/Ottoman/,'co','1806-12-27','1812-05-28'],
].map(a=>[a[0],a[1],d(a[2]),d(a[3])]);
const ERAS=[["1792-04-20","War of the First Coalition"],["1797-10-18","Egypt & the Directory"],["1798-12-29","War of the Second Coalition"],["1802-03-25","Peace of Amiens — Napoleon as Consul"],["1803-05-18","Napoleonic Wars begin"],["1805-08-09","Third Coalition"],["1806-10-09","Fourth Coalition — Prussia & Russia"],["1807-07-09","Tilsit — the Empire at its height"],["1808-05-02","Peninsular War"],["1809-04-10","Fifth Coalition — Austria rises"],["1809-10-14","The Continental System"],["1812-06-24","Invasion of Russia"],["1812-10-19","The Retreat"],["1813-03-17","Sixth Coalition — War of Liberation"],["1814-04-06","Elba"],["1815-03-20","The Hundred Days"],["1815-06-19","Peace"]].map(e=>[d(e[0]),e[1]]);
const evs=EV.map(e=>({n:e[0],t:d(e[1]),ds:e[1],lat:e[2],lon:e[3],sides:e[4],res:e[5],w:e[6]}));
const ars=AR.map(a=>({n:a[0],t0:d(a[1]),t1:d(a[2]),k:a[3],pts:a[4].map(p=>[p[1],p[0]])}));
const W=()=>innerWidth,H=()=>innerHeight;
const proj=d3.geoMercator(), path=d3.geoPath(proj);
const svg=d3.select("svg"), view=d3.select("#view");
const VIEWS={eu:[[-12,35],[42,62]],ib:[[-10,35.5],[4,44]],ce:[[5,44],[22,56]],ru:[[20,50],[40,58]]};
function fit(v,anim){const g={type:"MultiPoint",coordinates:[VIEWS[v][0],VIEWS[v][1],[VIEWS[v][0][0],VIEWS[v][1][1]],[VIEWS[v][1][0],VIEWS[v][0][1]]]};
 proj.fitExtent([[20,80],[W()-20,H()-130]],{type:"MultiPoint",coordinates:[[-12,35],[42,62],[-12,62],[42,35]]});
 const b=path.bounds(g),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],k=Math.min(W()/dx,(H()-150)/dy)*0.92,
 tx=W()/2-k*(b[0][0]+b[1][0])/2,ty=(H()-60)/2-k*(b[0][1]+b[1][1])/2;
 (anim?svg.transition().duration(1200):svg).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));}
const zoom=d3.zoom().scaleExtent([.6,14]).on("zoom",e=>{view.attr("transform",e.transform);d3.selectAll(".ev").attr("r",function(){return +this.dataset.r/Math.sqrt(e.transform.k)});d3.selectAll(".lbl").attr("font-size",10/Math.sqrt(e.transform.k));});
svg.call(zoom);
let snap=null;
function snapshot(t){const y=new Date(t).getUTCFullYear();return y<1800?1783:y<1815?1800:1815;}
function bloc(name,t){for(const a of ALLEG){if(a[0].test(name)&&t>=a[2]&&t<a[3])return a[1];}return 'neu';}
function drawStates(t){const s=snapshot(t);
 if(s!==snap){snap=s;const sel=d3.select("#states").selectAll("path").data(BORDERS[s],f=>f.properties.n);
  sel.exit().transition().duration(700).style("opacity",0).remove();
  sel.enter().append("path").attr("class","state neu").style("opacity",0).attr("d",path).on("mousemove",(e,f)=>tip(e,`<b>${f.properties.n}</b><i>${({fr:'French bloc',co:'Coalition',neu:'Neutral'})[bloc(f.properties.n,T)]}</i>`)).on("mouseleave",hide).transition().duration(700).style("opacity",1);
  sel.attr("d",path);}
 d3.select("#states").selectAll("path").attr("class",f=>"state "+bloc(f.properties.n,t));
 const big=["France","Spain","Prussia","Austrian Empire","Russian Empire","Ottoman Empire","UK","United Kingdom of Great Britain and Ireland","Portugal","Sweden","Denmark-Norway","Kingdom of the Two Sicilies"];
 const lab=d3.select("#labels").selectAll("text").data(BORDERS[snap].filter(f=>big.includes(f.properties.n)),f=>f.properties.n);
 lab.exit().remove();lab.enter().append("text").attr("class","lbl").merge(lab).attr("transform",f=>`translate(${path.centroid(f)})`).text(f=>f.properties.n.replace("United Kingdom of Great Britain and Ireland","Britain").replace("UK","Britain").replace(" Empire","").replace("Kingdom of the ",""));}
const line=d3.line().x(p=>proj(p)[0]).y(p=>proj(p)[1]).curve(d3.curveCatmullRom.alpha(.6));
function drawArrows(t){const act=ars.filter(a=>t>=a.t0&&t<a.t1+45*DAY);
 const s=d3.select("#arrows").selectAll("path").data(act,a=>a.n);s.exit().transition().duration(600).style("opacity",0).remove();
 s.enter().append("path").attr("class",a=>"arrow "+a.k).style("opacity",0).transition().duration(400).style("opacity",1);
 d3.select("#arrows").selectAll("path").attr("d",a=>{const f=Math.min(1,(t-a.t0)/(a.t1-a.t0));const n=Math.max(2,Math.ceil(a.pts.length*f));return line(a.pts.slice(0,n));}).style("opacity",a=>t>a.t1?Math.max(0,1-(t-a.t1)/(45*DAY)):1);}
function drawEvents(t){const vis=evs.filter(e=>t>=e.t);
 const s=d3.select("#evts").selectAll("circle").data(vis,e=>e.n);
 s.enter().append("circle").attr("class","ev").attr("cx",e=>proj([e.lon,e.lat])[0]).attr("cy",e=>proj([e.lon,e.lat])[1]).attr("data-r",e=>1.6+e.w*.7).attr("r",0)
  .on("mousemove",(e,ev)=>tip(e,`<b>${ev.n}</b>${ev.ds} · ${ev.sides}<br><i>${ev.res}</i>`)).on("mouseleave",hide)
  .transition().duration(300).attr("r",function(){return +this.dataset.r/Math.sqrt(d3.zoomTransform(svg.node()).k)});
 s.exit().remove();
 d3.select("#evts").selectAll("circle").attr("class",e=>"ev"+(t-e.t>60*DAY?" past":""));
 const live=evs.filter(e=>t>=e.t&&t<e.t+40*DAY);
 const r=d3.select("#rings").selectAll("circle").data(live,e=>e.n);r.exit().remove();
 r.enter().append("circle").attr("class","ring").attr("cx",e=>proj([e.lon,e.lat])[0]).attr("cy",e=>proj([e.lon,e.lat])[1]);
 d3.select("#rings").selectAll("circle").attr("r",e=>{const f=(t-e.t)/(40*DAY);return (3+e.w*4)*f*2.2/Math.sqrt(d3.zoomTransform(svg.node()).k)}).style("opacity",e=>1-(t-e.t)/(40*DAY));
 const recent=evs.filter(e=>t>=e.t&&t<e.t+200*DAY).slice(-3).reverse();
 const tk=d3.select("#ticker").selectAll(".card").data(recent,e=>e.n);tk.exit().remove();
 tk.enter().append("div").attr("class","card").html(e=>`<b>${e.n}</b>${e.ds} · ${e.sides}<br><i>${e.res}</i>`);}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function hud(t){const D=new Date(t);d3.select("#year").text(D.getUTCFullYear());d3.select("#date").text(`${D.getUTCDate()} ${MON[D.getUTCMonth()]} ${D.getUTCFullYear()}`);
 let era="";for(const e of ERAS)if(t>=e[0])era=e[1];d3.select("#era").text(era);}
function tip(e,h){const q=d3.select("#tip").style("display","block").html(h);const n=q.node();let x=e.clientX+14,y=e.clientY+14;if(x+n.offsetWidth>W())x=e.clientX-n.offsetWidth-10;if(y+n.offsetHeight>H())y=e.clientY-n.offsetHeight-10;q.style("left",x+"px").style("top",y+"px");}
function hide(){d3.select("#tip").style("display","none");}
let T=T0,playing=false,speed=1,last=0;const SP=[1,2,4];
function render(){drawStates(T);drawArrows(T);drawEvents(T);hud(T);d3.select("#t").property("value",Math.round((T-T0)/DAY));}
function daysPerSec(t){const near=evs.some(e=>Math.abs(e.t-t)<30*DAY)||ars.some(a=>t>=a.t0&&t<a.t1);return (near?14:70)*speed;}
function tick(now){if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;T+=daysPerSec(T)*dt*DAY;if(T>=T1){T=T1;playing=false;d3.select("#play").text("▶ Replay").classed("on",false);}render();requestAnimationFrame(tick);}
d3.select("#play").on("click",function(){if(T>=T1)T=T0;playing=!playing;d3.select(this).text(playing?"❚❚ Pause":"▶ Play").classed("on",playing);if(playing){last=performance.now();requestAnimationFrame(tick);}});
d3.select("#spd").on("click",function(){speed=SP[(SP.indexOf(speed)+1)%SP.length];d3.select(this).text(speed+"×");});
d3.select("#rst").on("click",()=>{playing=false;T=T0;d3.select("#play").text("▶ Play").classed("on",false);render();});
d3.select("#t").attr("max",NDAYS).on("input",function(){T=T0+(+this.value)*DAY;render();});
d3.selectAll(".seg button").on("click",function(){d3.selectAll(".seg button").classed("on",false);d3.select(this).classed("on",true);fit(this.dataset.v,true);});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();d3.select("#play").dispatch("click");}});
function layout(){proj.fitExtent([[20,80],[W()-20,H()-130]],{type:"MultiPoint",coordinates:[[-12,35],[42,62],[-12,62],[42,35]]});snap=null;d3.select("#states").selectAll("path").remove();render();}
addEventListener("resize",layout);
layout();fit("eu",false);
}
__boot();
</script></body></html>
