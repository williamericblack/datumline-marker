name: datumline-daily-mark
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python run_cohort.py
      - name: Commit results
        run: |
          git config user.name  "datumline-marker"
          git config user.email "watch@datumline.dev"
          git add docs/
          git diff --staged --quiet || git commit -m "mark: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
