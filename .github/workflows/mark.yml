name: daily mark

# Hardening notes (read before editing):
#  - workflow_dispatch is deliberate: GitHub cron is best-effort and can be delayed
#    or skipped entirely. A manual trigger is the only way to force a run.
#  - The heartbeat file is written on EVERY run whether or not grades changed.
#    Without it a run that produces no diff makes no commit, the repo looks
#    inactive, and GitHub auto-disables scheduled workflows after 60 days of
#    inactivity. The heartbeat guarantees a commit and keeps the schedule alive.
#  - PUBLICATION IS GATED ON VERIFY. The commit step used to `git add docs/`
#    unconditionally under `if: always()`, which meant a run that failed the
#    suppression check still pushed the offending feed: the job went red and the
#    DL-4 published anyway. It now commits the candidate artifacts ONLY when both
#    mark and verify succeeded. On refusal it restores the previously published
#    artifacts and commits the heartbeat alone, so the schedule stays alive while
#    nothing bad reaches the public feed.
#  - docs/index.html is a checked-in static shell, no longer generated by
#    run_cohort.py. Verify asserts it is present and still carries the published
#    disclosures, so the front door cannot be silently emptied.
#  - Failure notification goes to ntfy. A failed notification never fails the job.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-mark
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cohort marking
        id: mark
        run: python run_cohort.py

      - name: TEMPORARY DONE-TEST - inject a DL-4 into the feed input
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("docs/feed.json")
          feed = json.loads(p.read_text())
          victim = feed["entries"][0]
          print("BEFORE:", json.dumps(victim))
          victim["grade"] = "DL-4"
          victim["status"] = "RATED"
          p.write_text(json.dumps(feed, indent=2))
          print("AFTER :", json.dumps(victim))
          print("A DL-4 is now sitting in the feed that verify is about to inspect.")
          PY

      - name: Write heartbeat
        if: always()
        run: |
          mkdir -p docs
          printf '{"heartbeat":"%s","run_id":"%s","status":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_RUN_ID}" \
            "${{ steps.mark.outcome }}" > docs/heartbeat.json

      - name: Verify feed is fresh, well-formed, and suppressed
        id: verify
        if: steps.mark.outcome == 'success'
        run: |
          python - <<'PY'
          import json, re, sys, datetime, pathlib

          feed = json.load(open("docs/feed.json"))
          marked = feed.get("last_marked") or feed.get("meta", {}).get("last_marked")
          if not marked:
              sys.exit("FAIL: feed.json carries no last_marked")
          age = (datetime.datetime.now(datetime.timezone.utc)
                 - datetime.datetime.fromisoformat(marked.replace("Z", "+00:00")))
          if age.total_seconds() > 3600:
              sys.exit(f"FAIL: last_marked is {age} old - the run did not update the feed")

          entries = feed.get("entries") or feed.get("items") or []
          if not entries:
              sys.exit("FAIL: feed.json has zero entries")

          bad = [e for e in entries if str(e.get("grade", "")) in ("DL-4", "DL-5")]
          if bad:
              names = ", ".join(str(e.get("entity_id")) for e in bad[:5])
              sys.exit(f"FAIL: low-band suppression breached - {len(bad)} entry/entries "
                       f"would publish ({names}). REFUSING TO PUBLISH.")

          # The front door is a checked-in static shell. If it goes missing or loses
          # its disclosures, the site root stops being publishable - fail here rather
          # than serve a page that has quietly shed its legal text.
          page = pathlib.Path("docs/index.html")
          if not page.exists():
              sys.exit("FAIL: docs/index.html is missing - the site root would 404")
          # Collapse whitespace before matching so reflowing a paragraph in the
          # page cannot fail the build; only losing the words themselves can.
          html = re.sub(r"\s+", " ", page.read_text(encoding="utf-8"))
          required = {
              "client-side feed render": './feed.json',
              "36-hour stale threshold": 'STALE_HOURS = 36',
              "facts section": 'Facts &mdash; what was observed'.replace('&mdash;', '—'),
              "derivation section": 'Derivation — how the observation became a number',
              "conclusion section": 'Conclusion — what the grade does and does not mean',
              "what was NOT evaluated": 'What was NOT evaluated',
              "absence-of-finding line": 'Absence of a finding is not a finding of absence',
              "no-pay independence": 'No rated party pays for a grade',
              "paid report parity": 'paid report yields the same grade as the public feed',
              "5-business-day right of reply": 'within 5 business days',
              "equal-prominence corrections": 'equal prominence',
              "nominative use only": 'nominative use only',
              "no third-party logos": 'No third-party logos, wordmarks, icons, or brand styling are reproduced',
          }
          missing = [k for k, v in required.items() if v not in html]
          if missing:
              sys.exit("FAIL: docs/index.html lost published disclosures: "
                       + ", ".join(missing))

          print(f"OK: {len(entries)} entries, last_marked {marked}, suppression intact, "
                f"front door carries all {len(required)} required disclosures")
          PY

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "datumline-marker"
          git config user.email "actions@users.noreply.github.com"

          if [ "${{ steps.mark.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
            git add docs/
            MSG="mark: $(date -u +%Y-%m-%d)"
          else
            # Publication refused. Throw away this run's candidate artifacts and
            # leave the previously published feed standing untouched. Only the
            # heartbeat is committed, so the schedule stays alive and the failure
            # is visible in docs/heartbeat.json.
            echo "::error::publication refused (mark=${{ steps.mark.outcome }} verify=${{ steps.verify.outcome }}) - candidate artifacts discarded, public feed left unchanged"
            git checkout -- docs/feed.json docs/marks.json docs/methodology.json docs/index.html 2>/dev/null || true
            git add docs/heartbeat.json
            MSG="heartbeat: $(date -u +%Y-%m-%d) (publication refused, run ${GITHUB_RUN_ID})"
          fi

          git diff --staged --quiet || git commit -m "$MSG"
          git push

      - name: Confirm the published site root is reachable
        if: always()
        run: |
          URL="https://williamericblack.github.io/datumline-marker/"
          echo "checking $URL"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -L -o /tmp/root.html -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "SITE ROOT OK: $URL -> HTTP 200 ($(wc -c < /tmp/root.html) bytes)"
              grep -q 'Absence of a finding is not a finding of absence' /tmp/root.html \
                && echo "served page carries the published disclosures" \
                || echo "::warning::served page did not contain the disclosure marker (deploy may still be propagating)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::site root did not return 200 after 5 attempts (last: $CODE)"
          exit 1

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -m 10 -d "datumline-marker FAILED run ${GITHUB_RUN_ID}" \
            ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
