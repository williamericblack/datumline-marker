<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIDES Daily</title>
<meta name="description" content="Five maps from history. Guess the year. A new set every day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e0b45a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap">
<link rel="stylesheet" href="game.css">
</head>
<body>
<header id="top">
 <div><b>TIDES Daily</b><span id="dayno"></span></div>
 <div id="dots" aria-label="Round results"></div>
</header>
<div id="map"><svg id="stage" aria-label="Historical map for this round"><defs id="defs"></defs><g id="view"><g id="states"></g><g id="labels"></g><g id="target"></g></g></svg></div>
<section id="panel">
 <div id="round"></div>
 <p id="clue"></p>
 <div id="guessbox">
  <div id="guessyear" aria-live="polite"></div>
  <input id="slider" type="range" aria-label="Your guess for the year">
  <div class="range"><span id="rmin"></span><span id="rmax"></span></div>
  <button id="submit" class="primary">Lock in my guess</button>
 </div>
 <div id="reveal" hidden>
  <p id="r-score"></p>
  <p id="r-event"></p>
  <p id="r-detail"></p>
  <button id="next" class="primary">Next map</button>
 </div>
 <div id="done" hidden>
  <p id="d-score"></p>
  <pre id="share"></pre>
  <button id="copy" class="primary">Copy result</button>
  <p class="m">A new set of five maps every day. <a href="index.html">Explore the full maps</a></p>
 </div>
</section>
<script src="vendor/d3.min.js"></script>
<script src="time.js"></script>
<script src="game.js"></script>
</body>
</html>
