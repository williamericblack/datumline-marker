<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIDES</title>
<meta name="description" content="Press play and watch borders, battles and campaigns change across Europe, the Americas and West Africa. Real history, every event sourced.">
<meta property="og:title" content="TIDES — history in motion">
<meta property="og:description" content="Press play and watch the map of history change. Europe 1792–1815 · Americas 1775–1826 · West Africa 1878–1914.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e0b45a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="tides.css">
</head>
<body>
<div id="map"><svg aria-label="Animated historical map"><g id="view"><g id="states"></g><g id="arrows"></g><g id="rings"></g><g id="evts"></g><g id="labels"></g></g></svg></div>
<div id="hud"><div id="year">&nbsp;</div><div id="date"></div><div id="era"></div></div>
<div id="brand"><b>TIDES</b><span id="sub"></span></div>
<div id="ticker"></div>
<div id="tip"></div>

<div id="intro" class="show">
 <div class="box">
  <div class="kicker" id="i-kicker"></div>
  <h1 id="i-title"></h1>
  <p id="i-text"></p>
  <button id="bigplay" aria-label="Play">▶ Play</button>
  <p class="small">Real history · no units, no game · every event sourced</p>
 </div>
</div>

<div id="srcpanel" role="dialog" aria-label="Sources">
 <div class="hd"><b>Sources</b><button id="srcclose" aria-label="Close sources">✕</button></div>
 <div id="srcbody"></div>
 <p class="more"><a href="game.html">TIDES Daily: guess the year</a> · <a href="family.html">Where is your family from?</a> · <a href="test.html">Stories</a></p>
</div>

<div id="bar">
 <div id="slices" role="tablist"></div>
 <div id="ctl">
  <button id="play">▶ Play</button>
  <button id="spd" title="Speed">1×</button>
  <button id="rst" title="Restart">↺</button>
  <button id="src" title="Sources">Sources</button>
  <div class="seg" id="views"></div>
 </div>
 <input id="t" type="range" min="0" max="1" step="1" value="0" aria-label="Timeline">
 <div id="legend"></div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="time.js"></script>
<script src="tides.js"></script>
</body>
</html>
