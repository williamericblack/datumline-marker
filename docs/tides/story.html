<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIDES Story</title>
<meta name="description" content="A 35-second animated map story from TIDES.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@500;700&family=Barlow+Condensed:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e0b45a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="story.css">
</head>
<body data-look="dark">
<svg id="grain" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
<div id="map"><svg id="stage" aria-label="Animated historical map"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect class="base" width="7" height="7"/><rect class="stripe" width="2.6" height="7"/></pattern></defs><g id="view"><g id="states"></g><image id="relief" preserveAspectRatio="none"></image><g id="borders"></g><g id="arrows"></g><g id="rings"></g><g id="evts"></g><g id="leaders"></g></g></svg></div>
<div id="vignette"></div>
<header id="top">
 <div id="year"></div>
 <div id="meter" aria-label="Share of the mapped land held by each side">
  <div class="bar"><span class="fr"></span><span class="co"></span></div>
  <div class="lab"><span id="m-fr"></span><span id="m-co"></span></div>
 </div>
</header>
<div id="caption" aria-live="polite"></div>
<div id="hook"><p></p></div>
<div id="endcard"><p class="line"></p><a id="explore" href="index.html#europe">Open TIDES</a><button id="replay">↺ Replay</button></div>
<button id="start">▶ Play</button>
<div id="brand">TIDES</div>
<script src="vendor/d3.min.js"></script>
<script src="time.js"></script>
<script src="story.js"></script>
</body>
</html>
