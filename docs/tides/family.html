<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIDES Origins</title>
<meta name="description" content="Pick the town your family comes from and see who ruled it, from 3000 BC to today.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23e0b45a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--ink:#e8e4da;--mute:#8a90a0;--line:#2c3446;--accent:#e0b45a;--panel:#11151d;--land:#1d2330}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;line-height:1.55;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 48px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(34px,9vw,52px);line-height:1;margin:6px 0 0;text-wrap:balance}
p{margin:0}.m{color:var(--mute);font-size:12.5px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
input{font:inherit;font-size:16px;width:100%;padding:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#matches{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
#matches:empty{display:none}
#matches li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 12px;cursor:pointer;border-top:1px solid var(--line)}
#matches li:first-child button{border-top:0}
#matches li button:hover,#matches li button:focus-visible{background:var(--panel);color:var(--accent)}
#matches small{color:var(--mute)}
.births{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#result{display:flex;flex-direction:column;gap:16px}
#result[hidden]{display:none}
#place{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.1;margin:0}
#locator{width:100%;aspect-ratio:2/1;max-width:100%;display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px}
#locator path{fill:var(--land);stroke:var(--line);stroke-width:.4}
#locator .dot{fill:var(--accent)}#locator .halo{fill:none;stroke:var(--accent);stroke-width:1.5}
#notes{display:flex;flex-direction:column;gap:8px}
.note{padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel)}
.note b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:16px}
ol.timeline{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
ol.timeline li{position:relative;padding:6px 0 6px 18px}
ol.timeline li::before{content:"";position:absolute;left:-4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--mute)}
ol.timeline li.hit::before{background:var(--accent)}
ol.timeline .yr{display:inline-block;min-width:7.5em;color:var(--mute);font-variant-numeric:tabular-nums}
ol.timeline .who{font-family:Fraunces,Georgia,serif;font-size:16px}
ol.timeline .tag{display:block;font-size:11.5px;color:var(--accent)}
#stories:empty{display:none}
#stories a{display:inline-block;margin:0 8px 8px 0;padding:9px 12px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
 <header>
  <p class="kicker">TIDES Origins</p>
  <h1>Where is your family from?</h1>
 </header>
 <p>Type a town or city. See who ruled it, from 3000 BC to today, and what it was part of when your family members were born.</p>
 <div>
  <label for="q">Town or city</label>
  <input id="q" type="search" autocomplete="off" placeholder="e.g. Kumasi, Cusco, Kraków, Lagos">
  <ul id="matches" role="listbox" aria-label="Matching places"></ul>
 </div>
 <div class="births">
  <div><label for="b-you">Your birth year</label><input id="b-you" inputmode="numeric" placeholder="1990"></div>
  <div><label for="b-par">A parent</label><input id="b-par" inputmode="numeric" placeholder="1962"></div>
  <div><label for="b-gp">A grandparent</label><input id="b-gp" inputmode="numeric" placeholder="1935"></div>
  <div><label for="b-ggp">A great-grandparent</label><input id="b-ggp" inputmode="numeric" placeholder="1905"></div>
 </div>
 <p class="m">Birth years stay on this page. Nothing is sent anywhere.</p>
 <section id="result" hidden aria-live="polite">
  <h2 id="place"></h2>
  <svg id="locator" viewBox="0 0 800 400" role="img" aria-label="Location on a world map"></svg>
  <div id="notes"></div>
  <div id="stories"></div>
  <ol class="timeline" id="timeline"></ol>
  <p class="m" id="src"></p>
 </section>
</main>
<script src="vendor/d3.min.js"></script>
<script src="family.js"></script>
</body>
</html>
